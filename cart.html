<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>МойМагазин — Корзина</title>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <!-- ШАПКА (одна на всех страницах, логика счётчика — в main.js) -->
    <header class="bg-slate-900 text-white">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center">
            <a href="index.html" class="text-xl font-bold">🛍️ МойМагазин</a>
            <a href="cart.html" class="ml-auto bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-medium">
                Корзина (<span data-cart-count>0</span>)
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
        <h1 class="text-3xl font-bold">Корзина</h1>

        <!-- Уведомление о заказе (обычный блок, не модальное окно) -->
        <div data-notice class="hidden mt-6 bg-green-100 border border-green-400 text-green-800 px-4 py-3 rounded-lg">
            ✅ Заказ оформлен! Спасибо за покупку. Корзина очищена.
        </div>

        <!-- Сюда скрипт cart.page.js нарисует строки корзины -->
        <div data-cart-list class="mt-6 flex flex-col gap-4">
            <p class="text-slate-500">Загрузка корзины…</p>
        </div>

        <!-- Итог + кнопка «Купить» -->
        <div class="mt-6 bg-white rounded-xl shadow p-5 flex items-center gap-4">
            <p class="text-lg">Итого: <span data-cart-total class="font-bold">0</span></p>
            <button
                data-buy
                class="ml-auto bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-6 rounded-lg"
            >Купить</button>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 text-sm text-center py-4">
        © 2026 МойМагазин
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/search.js"></script>
    <script src="assets/js/cart.page.js"></script>
</body>
</html>
